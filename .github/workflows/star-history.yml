name: 生成 Star 趋势图

# 每天跑一次（也支持手动触发），把 docs/star-history.svg 更新掉。
# 这样 README 里的图不依赖 star-history.com，国内也能看。

on:
  schedule:
    - cron: "17 3 * * *"      # 每天 UTC 03:17（北京时间 11:17）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/star_history.py"
      - ".github/workflows/star-history.yml"

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/star_history.py --repo "${{ github.repository }}" --out docs/star-history.svg

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          if git diff --cached --quiet; then
            echo "星标数没变，跳过"
          else
            git commit -m "docs: 更新 Star 趋势图"
            git push
          fi
